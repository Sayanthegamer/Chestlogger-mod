name: CI & Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Verify & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Run Automated Verification
        run: ./gradlew check --stacktrace

      - name: Build Release Binaries
        run: ./gradlew build --stacktrace

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chestlogger-binaries
          path: |
            chestlogger-fabric/build/libs/*.jar
            chestlogger-paper/build/libs/*.jar
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ "$TAG_NAME" = "$GITHUB_REF" ]; then
            TAG_NAME="v2.6.0"
          fi
          echo "Publishing release for tag: $TAG_NAME"
          gh release create "$TAG_NAME" \
            chestlogger-fabric/build/libs/*.jar \
            chestlogger-paper/build/libs/*.jar \
            --title "Release $TAG_NAME" \
            --generate-notes || gh release upload "$TAG_NAME" chestlogger-fabric/build/libs/*.jar chestlogger-paper/build/libs/*.jar --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
