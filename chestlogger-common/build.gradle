plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-common"
}

repositories {
    mavenCentral()
}

dependencies {
    // High performance compression & buffers
    api 'org.lz4:lz4-java:1.8.0'
    api 'com.github.luben:zstd-jni:1.5.7-1'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.3'

    testFixturesApi 'org.junit.jupiter:junit-jupiter:5.12.0'
    testFixturesApi 'org.assertj:assertj-core:3.27.3'
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
}
