<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    
    <linearGradient id="frame-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Wood Shading (Top, Left, Right) -->
    <linearGradient id="wood-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a6240" />
      <stop offset="100%" stop-color="#6e4d30" />
    </linearGradient>
    <linearGradient id="wood-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#543922" />
      <stop offset="100%" stop-color="#352212" />
    </linearGradient>
    <linearGradient id="wood-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64442a" />
      <stop offset="100%" stop-color="#442c18" />
    </linearGradient>

    <!-- Iron Edges -->
    <linearGradient id="iron-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="iron-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="iron-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#273449" />
    </linearGradient>

    <!-- Glowing Cyan Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow -->
    <filter id="chest-drop-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Base Rounded Tile -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg-grad)" stroke="url(#frame-glow)" stroke-width="4" />
  
  <!-- Subtle Cyan Ambient Radial Glow -->
  <circle cx="256" cy="240" r="170" fill="#0ea5e9" opacity="0.1" filter="blur(50px)" />

  <g filter="url(#chest-drop-shadow)">
    <!-- ================= 1. MAIN CHEST FACES ================= -->
    <!-- TOP LID (Isometric diamond) -->
    <polygon points="256,90 396,170 256,250 116,170" fill="url(#wood-top)" stroke="#271a0e" stroke-width="3" stroke-linejoin="round" />
    
    <!-- LEFT BODY -->
    <polygon points="116,170 256,250 256,390 116,310" fill="url(#wood-left)" stroke="#1a1008" stroke-width="3" stroke-linejoin="round" />
    
    <!-- RIGHT BODY -->
    <polygon points="256,250 396,170 396,310 256,390" fill="url(#wood-right)" stroke="#1a1008" stroke-width="3" stroke-linejoin="round" />

    <!-- ================= 2. WOOD PLANK LINES ================= -->
    <!-- Top Face Planks -->
    <line x1="162" y1="144" x2="302" y2="224" stroke="#48321e" stroke-width="3" />
    <line x1="210" y1="117" x2="350" y2="197" stroke="#48321e" stroke-width="3" />
    
    <!-- Left Face Planks -->
    <line x1="116" y1="216" x2="256" y2="296" stroke="#24160a" stroke-width="3" />
    <line x1="116" y1="264" x2="256" y2="344" stroke="#24160a" stroke-width="3" />
    
    <!-- Right Face Planks -->
    <line x1="256" y1="296" x2="396" y2="216" stroke="#332011" stroke-width="3" />
    <line x1="256" y1="344" x2="396" y2="264" stroke="#332011" stroke-width="3" />

    <!-- ================= 3. THICK IRON REINFORCEMENT BANDS ================= -->
    <!-- Center Vertical Band -->
    <polygon points="248,250 264,250 264,390 248,390" fill="url(#iron-top)" stroke="#0f172a" stroke-width="1.5" />
    
    <!-- Left Vertical Band -->
    <polygon points="116,170 130,178 130,318 116,310" fill="url(#iron-left)" stroke="#0f172a" stroke-width="1.5" />
    
    <!-- Right Vertical Band -->
    <polygon points="396,170 382,178 382,318 396,310" fill="url(#iron-right)" stroke="#0f172a" stroke-width="1.5" />

    <!-- Bottom Outer Rim Bands -->
    <polygon points="116,302 256,382 256,390 116,310" fill="url(#iron-left)" stroke="#0f172a" stroke-width="1" />
    <polygon points="256,382 396,302 396,310 256,390" fill="url(#iron-right)" stroke="#0f172a" stroke-width="1" />

    <!-- Top Outer Rim Bands -->
    <polygon points="256,90 270,98 256,106 242,98" fill="url(#iron-top)" stroke="#0f172a" stroke-width="1.5" />
    <polygon points="116,170 132,161 144,168 128,177" fill="url(#iron-left)" stroke="#0f172a" stroke-width="1" />
    <polygon points="396,170 380,161 368,168 384,177" fill="url(#iron-right)" stroke="#0f172a" stroke-width="1" />

    <!-- ================= 4. GLOWING CYAN TELEMETRY SEAM ================= -->
    <!-- Lid Seam (Neon Circuit Line) -->
    <polyline points="116,205 256,285 396,205" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />
    <polyline points="116,205 256,285 396,205" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Vertical Data Tracks -->
    <line x1="186" y1="245" x2="186" y2="335" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round" opacity="0.9" filter="url(#neon-glow)" />
    <line x1="326" y1="245" x2="326" y2="335" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round" opacity="0.9" filter="url(#neon-glow)" />

    <!-- ================= 5. GOLD SECURITY LOCK & LATCH ================= -->
    <!-- Latch Plate Drop Shadow -->
    <rect x="242" y="238" width="28" height="46" rx="6" fill="#000000" opacity="0.5" />
    
    <!-- Latch Outer Plate (Gold) -->
    <rect x="244" y="236" width="24" height="44" rx="5" fill="#f59e0b" stroke="#78350f" stroke-width="2" />
    
    <!-- Latch Inner Bevel -->
    <rect x="247" y="239" width="18" height="18" rx="3" fill="#fbbf24" />
    <rect x="247" y="260" width="18" height="16" rx="3" fill="#d97706" />

    <!-- Keyhole Notch -->
    <circle cx="256" cy="266" r="3" fill="#451a03" />
    <polygon points="254.5,266 257.5,266 258,273 254,273" fill="#451a03" />

    <!-- Glowing Cyan Status LED -->
    <circle cx="256" cy="248" r="3" fill="#00f0ff" filter="url(#neon-glow)" />
    <circle cx="256" cy="248" r="1.2" fill="#ffffff" />
  </g>
</svg>
