<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    
    <linearGradient id="frame-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Wood Shading -->
    <linearGradient id="wood-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c6442" />
      <stop offset="100%" stop-color="#6a492e" />
    </linearGradient>
    <linearGradient id="wood-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#734f32" />
      <stop offset="100%" stop-color="#4d331e" />
    </linearGradient>
    <linearGradient id="wood-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#452d19" />
      <stop offset="100%" stop-color="#28190d" />
    </linearGradient>

    <!-- Iron Edges -->
    <linearGradient id="iron-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="iron-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Cyan Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow -->
    <filter id="chest-drop-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Base Rounded Tile -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg-grad)" stroke="url(#frame-glow)" stroke-width="4" />
  
  <!-- Subtle Cyan Ambient Glow -->
  <circle cx="256" cy="240" r="170" fill="#0ea5e9" opacity="0.1" filter="blur(50px)" />

  <g filter="url(#chest-drop-shadow)">
    <!-- ================= 1. MAIN CHEST FACES ================= -->
    <!-- TOP LID -->
    <polygon points="256,90 396,170 256,250 116,170" fill="url(#wood-top)" stroke="#271a0e" stroke-width="3" stroke-linejoin="round" />
    
    <!-- FRONT-RIGHT FACE (Facing camera/light) -->
    <polygon points="256,250 396,170 396,310 256,390" fill="url(#wood-front)" stroke="#1a1008" stroke-width="3" stroke-linejoin="round" />

    <!-- LEFT-SIDE FACE (In shadow) -->
    <polygon points="116,170 256,250 256,390 116,310" fill="url(#wood-side)" stroke="#1a1008" stroke-width="3" stroke-linejoin="round" />

    <!-- ================= 2. WOOD PLANK LINES ================= -->
    <!-- Top Planks -->
    <line x1="162" y1="144" x2="302" y2="224" stroke="#48321e" stroke-width="3" />
    <line x1="210" y1="117" x2="350" y2="197" stroke="#48321e" stroke-width="3" />
    
    <!-- Left Side Planks -->
    <line x1="116" y1="216" x2="256" y2="296" stroke="#1f1207" stroke-width="3" />
    <line x1="116" y1="264" x2="256" y2="344" stroke="#1f1207" stroke-width="3" />
    
    <!-- Front Face Planks -->
    <line x1="256" y1="296" x2="396" y2="216" stroke="#332011" stroke-width="3" />
    <line x1="256" y1="344" x2="396" y2="264" stroke="#332011" stroke-width="3" />

    <!-- ================= 3. THICK IRON CORNER BANDS ================= -->
    <!-- Center Vertical Band -->
    <polygon points="250,250 262,250 262,390 250,390" fill="url(#iron-light)" stroke="#0f172a" stroke-width="1.5" />
    
    <!-- Left Vertical Band -->
    <polygon points="116,170 128,177 128,317 116,310" fill="url(#iron-dark)" stroke="#0f172a" stroke-width="1.5" />
    
    <!-- Right Vertical Band -->
    <polygon points="396,170 384,177 384,317 396,310" fill="url(#iron-light)" stroke="#0f172a" stroke-width="1.5" />

    <!-- Bottom Outer Rim Bands -->
    <polygon points="116,303 256,383 256,390 116,310" fill="url(#iron-dark)" stroke="#0f172a" stroke-width="1" />
    <polygon points="256,383 396,303 396,310 256,390" fill="url(#iron-light)" stroke="#0f172a" stroke-width="1" />

    <!-- Top Outer Rim Bands -->
    <polygon points="256,90 268,97 256,104 244,97" fill="url(#iron-light)" stroke="#0f172a" stroke-width="1.5" />
    <polygon points="116,170 128,163 138,169 126,176" fill="url(#iron-dark)" stroke="#0f172a" stroke-width="1" />
    <polygon points="396,170 384,163 374,169 386,176" fill="url(#iron-light)" stroke="#0f172a" stroke-width="1" />

    <!-- ================= 4. GLOWING CYAN TELEMETRY SEAM ================= -->
    <!-- Lid Seam (Neon Circuit Line along both faces) -->
    <polyline points="116,205 256,285 396,205" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />
    <polyline points="116,205 256,285 396,205" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- ================= 5. GOLD SECURITY LATCH (CENTER OF FRONT FACE) ================= -->
    <!-- Lock located at center of front face: X=326, Y=245 (slanted along isometric 30-deg plane) -->
    <g transform="translate(326, 245)">
      <!-- Latch Shadow -->
      <polygon points="-16,-22 14,-39 14,14 -16,31" fill="#000000" opacity="0.5" />
      
      <!-- Outer Brass Lock Plate (Isometric Skew) -->
      <polygon points="-14,-20 14,-36 14,10 -14,26" fill="#f59e0b" stroke="#78350f" stroke-width="2" stroke-linejoin="round" />
      
      <!-- Inner Bevel Top Highlight -->
      <polygon points="-11,-16 11,-29 11,-10 -11,3" fill="#fbbf24" stroke="#d97706" stroke-width="1" />
      
      <!-- Inner Bevel Bottom Section -->
      <polygon points="-11,5 11,-8 11,8 -11,21" fill="#d97706" />

      <!-- Keyhole -->
      <circle cx="0" cy="5" r="2.8" fill="#451a03" />
      <polygon points="-1.5,5 1.5,5 2,12 -2,12" fill="#451a03" />

      <!-- Status LED on Latch -->
      <circle cx="0" cy="-12" r="2.5" fill="#00f0ff" filter="url(#neon-glow)" />
      <circle cx="0" cy="-12" r="1" fill="#ffffff" />
    </g>
  </g>
</svg>
