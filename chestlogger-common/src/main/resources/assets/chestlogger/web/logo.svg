<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Wood Textures -->
    <linearGradient id="wood-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#644a32" />
      <stop offset="100%" stop-color="#483321" />
    </linearGradient>
    <linearGradient id="wood-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b291a" />
      <stop offset="100%" stop-color="#24180d" />
    </linearGradient>
    <linearGradient id="wood-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4d3724" />
      <stop offset="100%" stop-color="#332214" />
    </linearGradient>

    <!-- Iron Edges -->
    <linearGradient id="iron-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="iron-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Telemetry -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow -->
    <filter id="chest-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base Rounded Badge -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#bg-glow)" stroke="url(#border-grad)" stroke-width="4" />
  
  <!-- Subtle Ambient Top Light Grid Pattern -->
  <circle cx="256" cy="180" r="160" fill="#38bdf8" opacity="0.06" filter="blur(40px)" />

  <g filter="url(#chest-shadow)">
    <!-- ================= CHEST BASE SHAPE ================= -->

    <!-- TOP LID FACE -->
    <polygon points="256,110 396,186 256,262 116,186" fill="url(#wood-top)" stroke="#1a1109" stroke-width="3" />
    
    <!-- Top Planks Linework -->
    <line x1="209" y1="135" x2="349" y2="211" stroke="#332214" stroke-width="2.5" />
    <line x1="162" y1="161" x2="302" y2="237" stroke="#332214" stroke-width="2.5" />

    <!-- LEFT FACE -->
    <polygon points="116,186 256,262 256,382 116,306" fill="url(#wood-left)" stroke="#1a1109" stroke-width="3" />
    <!-- Left Planks Linework -->
    <line x1="116" y1="226" x2="256" y2="302" stroke="#180f08" stroke-width="2.5" />
    <line x1="116" y1="266" x2="256" y2="342" stroke="#180f08" stroke-width="2.5" />

    <!-- RIGHT FACE -->
    <polygon points="256,262 396,186 396,306 256,382" fill="url(#wood-right)" stroke="#1a1109" stroke-width="3" />
    <!-- Right Planks Linework -->
    <line x1="256" y1="302" x2="396" y2="226" stroke="#24180d" stroke-width="2.5" />
    <line x1="256" y1="342" x2="396" y2="266" stroke="#24180d" stroke-width="2.5" />

    <!-- ================= IRON CORNER BANDS & BRACKETS ================= -->
    <!-- Top Corner Caps -->
    <polygon points="256,110 276,121 256,132 236,121" fill="url(#iron-light)" stroke="#0f172a" stroke-width="1.5" />
    <polygon points="116,186 136,197 126,210 106,199" fill="url(#iron-dark)" stroke="#0f172a" stroke-width="1.5" />
    <polygon points="396,186 406,199 386,210 376,197" fill="url(#iron-light)" stroke="#0f172a" stroke-width="1.5" />

    <!-- Vertical Iron Corner Edges -->
    <!-- Center Edge -->
    <polygon points="252,260 260,260 260,384 252,384" fill="url(#iron-light)" stroke="#0f172a" stroke-width="1" />
    <!-- Left Edge -->
    <polygon points="114,186 122,190 122,310 114,306" fill="url(#iron-dark)" stroke="#0f172a" stroke-width="1" />
    <!-- Right Edge -->
    <polygon points="396,186 388,190 388,310 396,306" fill="url(#iron-light)" stroke="#0f172a" stroke-width="1" />

    <!-- Bottom Edge Bands -->
    <polygon points="116,306 256,382 256,388 116,312" fill="url(#iron-dark)" />
    <polygon points="256,382 396,306 396,312 256,388" fill="url(#iron-light)" />

    <!-- ================= TELEMETRY / DATA SEAM (GLOWING CYAN) ================= -->
    <!-- Glowing Seam Line Around Chest Lid -->
    <polyline points="116,216 256,292 396,216" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" filter="url(#glow-cyan)" />
    <polyline points="116,216 256,292 396,216" stroke="#e0f2fe" stroke-width="1.5" stroke-linecap="round" />

    <!-- Vertical Telemetry Streams -->
    <line x1="186" y1="254" x2="186" y2="344" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4 6" opacity="0.8" filter="url(#glow-cyan)" />
    <line x1="326" y1="254" x2="326" y2="344" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 6" opacity="0.8" filter="url(#glow-cyan)" />

    <!-- ================= GOLD SECURITY LOCK / CLASP ================= -->
    <!-- Clasp Base -->
    <rect x="244" y="246" width="24" height="42" rx="5" fill="#f59e0b" stroke="#78350f" stroke-width="2.5" />
    <!-- Clasp Highlight -->
    <rect x="247" y="249" width="18" height="16" rx="3" fill="#fbbf24" />
    <!-- Keyhole / Indicator -->
    <circle cx="256" cy="272" r="3.5" fill="#451a03" />
    <rect x="254.5" y="272" width="3" height="7" fill="#451a03" />
    <!-- Status LED -->
    <circle cx="256" cy="256" r="2.5" fill="#38bdf8" filter="url(#glow-cyan)" />
  </g>
</svg>
