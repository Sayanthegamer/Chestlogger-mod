<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cl-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="cl-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c2e" />
      <stop offset="100%" stop-color="#0f1422" />
    </linearGradient>
    <filter id="cl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded container -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#cl-grad-dark)" stroke="url(#cl-grad-primary)" stroke-width="1.5" />
  
  <!-- Isometric Chest Top / Lid -->
  <polygon points="32,13 50,22 32,31 14,22" fill="#1e2638" stroke="url(#cl-grad-primary)" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Isometric Chest Left Face -->
  <polygon points="14,22 32,31 32,49 14,40" fill="#121726" stroke="url(#cl-grad-primary)" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Isometric Chest Right Face -->
  <polygon points="32,31 50,22 50,40 32,49" fill="#182033" stroke="url(#cl-grad-primary)" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Data Stream Pulses -->
  <line x1="32" y1="21" x2="32" y2="41" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="23" y1="27" x2="23" y2="35.5" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
  <line x1="41" y1="27" x2="41" y2="35.5" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Chest Lock / Clasp -->
  <rect x="29.5" y="27" width="5" height="7" rx="1.5" fill="#f59e0b" stroke="#090d16" stroke-width="0.8" />
  <circle cx="32" cy="29.5" r="0.8" fill="#090d16" />
</svg>
