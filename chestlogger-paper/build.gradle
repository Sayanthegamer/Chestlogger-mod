plugins {
    id 'java-library'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-paper"
}

repositories {
    mavenCentral()
    maven {
        name = 'PaperMC'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    implementation project(':chestlogger-common')
    testImplementation testFixtures(project(':chestlogger-common'))

    // Pinned Paper API / Dev Dependency
    compileOnly "io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT"
    testImplementation "io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT"

    // High performance compression & buffers
    implementation "org.lz4:lz4-java:1.8.0"

    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter:5.12.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.assertj:assertj-core:3.27.3"
}

processResources {
    inputs.property "version", project.version

    filesMatching("plugin.yml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    dependsOn ':chestlogger-common:jar'
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

test {
    useJUnitPlatform()
}
